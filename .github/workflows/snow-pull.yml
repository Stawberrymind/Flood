name: river-watch-forecast-data-bootstrap

# One bounded, resumable historical archive window. Every successful response is committed
# to the fork's public forecast-data branch, so a later run resumes from the first missing
# point/span. The cache is only an accelerator; the branch is the durable scientific input.

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: "UTC issue date whose archive should be prepared (YYYY-MM-DD)"
        required: false
        type: string
      max_archive_weight:
        description: "Conservative Open-Meteo weight budget for this bounded window"
        required: false
        default: "7500"
        type: string

permissions:
  contents: write

concurrency:
  group: forecast-data-persistence
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: river-watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r ../requirements.lock
      - run: pip install --no-deps --no-build-isolation -e ".[dev]"
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: river-watch/data/cache/openmeteo
          key: forecast-data-bootstrap-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hazard-openmeteo-${{ runner.os }}-
            forecast-data-bootstrap-${{ runner.os }}-
      - name: attach durable forecast-data branch
        run: |
          # The branch is public scientific input. GitHub's workflow token can
          # read master but may reject an unrelated-history branch over Git.
          git -c http.https://github.com/.extraheader= -c credential.helper= fetch --no-tags https://github.com/${{ github.repository }}.git forecast-data:refs/remotes/public/forecast-data
          git worktree add --detach ../forecast-data public/forecast-data
      - name: pull one bounded archive window
        id: bootstrap
        continue-on-error: true
        run: >-
          python -m river_watch.cli bootstrap-forecast-data
          --data-dir ../forecast-data
          --issue-date "${{ inputs.issue_date }}"
          --max-archive-weight "${{ inputs.max_archive_weight }}"
      - name: persist bootstrap progress
        if: always()
        run: |
          git -C ../forecast-data config user.name "github-actions[bot]"
          git -C ../forecast-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ../forecast-data add -A
          if git -C ../forecast-data diff --cached --quiet; then
            echo "forecast-data branch unchanged"
          else
            git -C ../forecast-data commit -m "forecast-data: persist bootstrap progress"
            git -C ../forecast-data push origin HEAD:forecast-data
          fi
      - name: fail until bootstrap is complete
        if: steps.bootstrap.outcome == 'failure'
        run: exit 1
