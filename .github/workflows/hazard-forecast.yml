name: river-watch-hazard-forecast

# One prospective hazard-watch cycle a day, committed with the runner's timestamp so the
# record cannot be edited after the outcome is known. Runs after BBMB's 06:00 IST bulletin
# is normally on the site. Public data only, no secrets: the BBMB bulletin, the CWC seed
# record and fitted parameters committed under river-watch/data/reference/, and keyless
# Open-Meteo forecasts. The run must never rewrite an earlier day's record.

on:
  schedule:
    - cron: "0 3 * * *"   # 08:30 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forecast-data-persistence
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: river-watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r ../requirements.lock
      - run: pip install --no-deps --no-build-isolation -e ".[dev]"
      - run: python -m pytest -q          # never publish from a red tree
      - name: attach durable forecast-data branch
        run: |
          # The branch is public scientific input. GitHub's workflow token can
          # read master but may reject an unrelated-history branch over Git.
          git -c http.https://github.com/.extraheader= -c credential.helper= fetch --no-tags https://github.com/${{ github.repository }}.git forecast-data:refs/remotes/public/forecast-data
          git worktree add --detach ../forecast-data public/forecast-data
      # The client keys forecasts by issue date and historical inputs by their
      # query. Keep successful public downloads between ephemeral runners,
      # including partial progress when the forecast step hits a quota/timeout.
      - name: cache public weather inputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: river-watch/data/cache/openmeteo
          key: hazard-openmeteo-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hazard-openmeteo-${{ runner.os }}-
      # The bulletin fetch can fail from a foreign runner (bbmb.gov.in has an incomplete TLS
      # chain and is not always reachable from outside India). A failed cycle is recorded in
      # the job log, while the durable weather progress is still committed below.
      - name: forecast cycle (required fresh product)
        id: forecast
        run: python -m river_watch.cli forecast
        timeout-minutes: 35
      - name: persist forecast-data progress
        if: always()
        run: |
          git -C ../forecast-data config user.name "github-actions[bot]"
          git -C ../forecast-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ../forecast-data add -A
          if git -C ../forecast-data diff --cached --quiet; then
            echo "forecast-data branch unchanged"
          else
            git -C ../forecast-data commit -m "forecast-data: persist public weather progress"
            git -C ../forecast-data push origin HEAD:forecast-data
          fi
      - name: commit the dated record
        if: steps.forecast.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/forecast/
          git diff --cached --quiet || git commit -m "hazard: prospective forecast record"
          # The job runs for minutes; a push that lands in between fails the
          # plain push with "fetch first". Rebase this one commit onto whatever
          # arrived and try again, a few times, before giving up.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin master && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep $((attempt * 10))
          done
          exit 1
