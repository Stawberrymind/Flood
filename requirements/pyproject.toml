# Lock-generation metadata only; this is not an installable project.
# Production CI and local validation use CPython 3.13. Compiler-runtime pins
# prevent the universal resolver selecting an obsolete Numba/LLVM fallback.
[project]
name = "flood-river-watch-ci-lock"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["numba==0.67.0", "llvmlite==0.49.0"]
