[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flood_river_watch"
version = "0.1.0"
description = "Flood Watch satellite monitoring and River-Watch flood forecasting for Punjab."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/Stawberrymind/flood_river_watch"
Website = "https://stawberrymind.github.io/flood_river_watch/"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["flood_watch*", "pipeline*"]
